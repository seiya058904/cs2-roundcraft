<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">CS2 Roundcraft — tactical simulation cover</title>
<desc id="desc">Original dark navy tactical artwork with a round planning map, player markers, event trails and broadcast-style typography. This is an illustration, not a gameplay capture.</desc>
