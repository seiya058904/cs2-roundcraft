  <linearGradient id="cut" x1="0" x2="1"><stop stop-color="#8DF9E0"/><stop offset="1" stop-color="#17CFB7"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8BC6D2" stroke-opacity=".075"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <clipPath id="round"><circle cx="1226" cy="299" r="221"/></clipPath>
</defs>
